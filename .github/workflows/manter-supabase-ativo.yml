name: Manter o Supabase ativo

# O plano grátis do Supabase pausa projetos parados há 1 semana.
# Isto faz uma consulta leve duas vezes por semana para evitar a pausa.
# No dia 1 de cada mês também grava um arquivo, porque o GitHub desliga
# tarefas agendadas em repositórios sem nenhuma atividade por 60 dias.

on:
  schedule:
    - cron: '17 12 * * 1,4'  # segunda e quinta, 09h17 em Brasília
    - cron: '17 12 1 * *'    # dia 1 de cada mês
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar o Supabase
        run: |
          URL=$(grep -oE 'SUPABASE_URL *= *["'"'"']?[^ "'"'"']+' config.js | head -1 | sed -E 's/.*= *//' | tr -d "\"'")
          KEY=$(grep -oE 'SUPABASE_(PUBLISHABLE(_DEFAULT)?|ANON)_KEY *= *["'"'"']?[^ "'"'"']+' config.js | head -1 | sed -E 's/.*= *//' | tr -d "\"'")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js ainda não foi preenchido." && exit 1
          fi
          if echo "$KEY" | grep -q '^eyJ'; then
            curl -fsS "$URL/rest/v1/docs?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          else
            curl -fsS "$URL/rest/v1/docs?select=id&limit=1" -H "apikey: $KEY" > /dev/null
          fi
          echo "Supabase respondeu."

      - name: Registrar atividade do mês
        if: github.event.schedule == '17 12 1 * *'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ultima-verificacao
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ultima-verificacao
          git commit -m "Registro mensal de atividade" || exit 0
          git push
